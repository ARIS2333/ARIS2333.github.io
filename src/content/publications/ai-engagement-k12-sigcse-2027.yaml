title: "Designing AI Engagement Across a Multi-Year Computing Curriculum for Grades 6–12"
authors:
  - Kehao Zheng
  - Jessie Jiang
  - Yang Shi
venue: SIGCSE TS
year: 2027
month: 2
status: accepted
summary: "Students still need foundations to understand, evaluate, and use AI-generated code. This poster describes a Grades 6–12 computing pathway with five learning goals and five forms of AI engagement: debugging, concept learning, planning, feature-level generation, and application-level generation. Earlier courses stay with debugging and concept learning. Later courses add planning and generation. A ten-session Advanced Python and Algorithms course shows one way to combine them, with instructors supervising how students use AI. I am the first author."
