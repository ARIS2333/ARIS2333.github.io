title: "Designing AI Engagement Across a Multi-Year Computing Curriculum for Grades 6–12"
authors:
  - Kehao Zheng
  - Jessie Jiang
  - Yang Shi
venue: SIGCSE TS
year: 2027
month: 2
summary: "Presents a multi-year Grades 6–12 computing curriculum that integrates generative AI systematically while preserving programming foundations and narrowing the education–industry gap. Courses progress across five forms of instructor-supervised AI engagement—from debugging and concept learning to planning, feature-level, and application-level generation—demonstrated through a ten-session Advanced Python & Algorithms course."
