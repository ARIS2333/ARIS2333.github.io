title: "Lightweight cosine convolution network for sleep apnea detection with single-lead ECG"
authors:
  - Rui Zhang
  - Kehao Zheng
  - Yong Wang
  - Weidong Zhou
  - Lan Tian
  - Guoyang Liu
venue: Neurocomputing
year: 2025
month: 12
summary: "Proposes Cos-ECGNet, a lightweight, interpretable single-lead ECG network for wearable sleep-apnea detection. Using learnable cosine filters and RRI–amplitude fusion with only 1,186 parameters, it achieves 91.82% accuracy (97.43% AUC) on Apnea-ECG and 79.63% on UCDDB, with Grad-CAM confirming apnea-related rhythm patterns. Contributed methodology, formal analysis, and original-draft writing."
tags:
  - Deep learning
  - ECG
  - Signal processing
  - Lightweight models
  - Interpretability
