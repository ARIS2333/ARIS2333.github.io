title: "CodeFlow: LLM-Generated Flowchart Feedback for Programming Students"
authors:
  - Kehao Zheng
  - Yang Shi
venue: SIGCSE TS
year: 2026
month: 2
summary: "Introduces CodeFlow, a web-based LLM system that translates student code into interactive flowcharts for real-time visual debugging feedback. It highlights syntax and logic errors directly on the diagram and generates an adaptive reference flowchart aligned with the student’s own algorithmic approach without revealing the complete code, piloted in CS1 Java at Utah State University."
tags:
  - Large language models
  - CS education
  - Program visualization
  - Debugging
links:
